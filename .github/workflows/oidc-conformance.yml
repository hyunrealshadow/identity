name: OIDC conformance test

on:
  workflow_dispatch:

permissions:
  contents: read

# Each job has its own temporary public hostname.
concurrency:
  group: oidc-conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_FILE: conformance/docker-compose.hosted.yml
      CONFORMANCE_IMAGE: identity-conformance:${{ github.run_id }}-${{ github.run_attempt }}
      CONFORMANCE_LOGIN_IMAGE: identity-conformance-login:${{ github.run_id }}-${{ github.run_attempt }}
      CONFORMANCE_RUNNER_IMAGE: identity-conformance-runner:${{ github.run_id }}-${{ github.run_attempt }}
      CONFORMANCE_ALIAS: build-only
      SUITE_URL: https://www.certification.openid.net
    outputs:
      profiles: ${{ steps.profiles.outputs.profiles }}
      matrix: ${{ steps.profiles.outputs.matrix }}
      image: ${{ env.CONFORMANCE_IMAGE }}
      login-image: ${{ env.CONFORMANCE_LOGIN_IMAGE }}
      runner-image: ${{ env.CONFORMANCE_RUNNER_IMAGE }}
      image-artifact: conformance-image-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate official account token
        env:
          CONFORMANCE_API_TOKEN: ${{ secrets.CONFORMANCE_API_TOKEN }}
        run: |
          if [ -z "$CONFORMANCE_API_TOKEN" ]; then
            echo "::error::Add the official suite API token as the CONFORMANCE_API_TOKEN repository secret"
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null \
            --header "Authorization: Bearer $CONFORMANCE_API_TOKEN" \
            "$SUITE_URL/api/currentuser"

      - name: Select every supported OP plan
        id: profiles
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'conformance')
          from plans import ci_cases
          cases = ci_cases()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('profiles=' + json.dumps([case['id'] for case in cases]) + '\n')
              output.write('matrix=' + json.dumps({'include': cases}) + '\n')
          PY

      - name: Build shared conformance images
        run: |
          docker compose build identity login runner
          docker compose run --rm --no-deps -e CONFORMANCE_ALIAS= runner -m unittest discover -s tests
          docker compose run --rm --no-deps runner -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); page = b.new_page(); page.set_content('<title>conformance runner</title>'); assert page.title() == 'conformance runner'; b.close(); p.stop()"
          docker image save "$CONFORMANCE_IMAGE" "$CONFORMANCE_LOGIN_IMAGE" "$CONFORMANCE_RUNNER_IMAGE" | gzip > "$RUNNER_TEMP/identity-image.tar.gz"

      - name: Upload shared conformance image
        uses: actions/upload-artifact@v7
        with:
          name: conformance-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/identity-image.tar.gz
          compression-level: 0
          retention-days: 1

  conformance:
    name: OP plan (${{ matrix.id }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      COMPOSE_FILE: conformance/docker-compose.hosted.yml
      COMPOSE_PROJECT_NAME: oidc-conformance
      CONFORMANCE_IMAGE: ${{ needs.prepare.outputs.image }}
      CONFORMANCE_LOGIN_IMAGE: ${{ needs.prepare.outputs.login-image }}
      CONFORMANCE_RUNNER_IMAGE: ${{ needs.prepare.outputs.runner-image }}
      PROFILE: ${{ matrix.profile }}
      RESPONSE_TYPE: ${{ matrix.response_type }}
      SUITE_URL: https://www.certification.openid.net
      CONFORMANCE_ALIAS: identity-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Download shared conformance image
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.image-artifact }}
          path: ${{ runner.temp }}/conformance-image

      - name: Load shared conformance image
        run: |
          gunzip -c "$RUNNER_TEMP/conformance-image/identity-image.tar.gz" | docker image load
          docker image inspect "$CONFORMANCE_IMAGE" > /dev/null
          docker image inspect "$CONFORMANCE_LOGIN_IMAGE" > /dev/null
          docker image inspect "$CONFORMANCE_RUNNER_IMAGE" > /dev/null
          mkdir -p conformance/results

      - name: Allocate temporary identity and login public hostnames
        run: |
          docker compose up -d --no-deps tunnel login-tunnel
          public_url=$(python conformance/ci_tunnel.py)
          login_url=$(python conformance/ci_tunnel.py --service login-tunnel)
          echo "IDENTITY_URL=$public_url" >> "$GITHUB_ENV"
          echo "LOGIN_URL=$login_url" >> "$GITHUB_ENV"
          echo "$public_url" > conformance/results/tunnel-url.txt
          echo "$login_url" > conformance/results/login-url.txt
          echo "Temporary public URL: $public_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Temporary login URL: $login_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Start identity with the public issuer
        run: |
          docker compose up -d --no-build --wait --wait-timeout 240 db identity login

      - name: Check public endpoints through Cloudflare
        env:
          CONFORMANCE_API_TOKEN: ${{ secrets.CONFORMANCE_API_TOKEN }}
        run: |
          set -o pipefail
          docker compose run --rm --no-deps --pull never runner ci_ready.py 2>&1 | tee conformance/results/readiness.log

      - name: Run official hosted OpenID Foundation test plan
        env:
          CONFORMANCE_API_TOKEN: ${{ secrets.CONFORMANCE_API_TOKEN }}
        run: |
          set -o pipefail
          response_args=()
          if [ -n "$RESPONSE_TYPE" ]; then
            response_args=(--response-type "$RESPONSE_TYPE")
          fi
          docker compose run --rm --no-deps --pull never runner run.py --no-docker --profile "$PROFILE" \
            "${response_args[@]}" \
            --identity-url "$IDENTITY_URL" --discovery-origin "$IDENTITY_URL" \
            --timeout 120 --exit-on-failure --results-dir results \
            2>&1 | tee conformance/results/runner.log

      - name: Publish official plan results
        if: always()
        env:
          CONFORMANCE_API_TOKEN: ${{ secrets.CONFORMANCE_API_TOKEN }}
        run: |
          if [ -f conformance/results/plan-url.txt ]; then
            docker compose run --rm --no-deps --pull never runner ci_publish.py --results-dir results
          else
            echo "No plan was created; skipping publication."
          fi

      - name: Collect service logs and summary
        if: always()
        run: |
          mkdir -p conformance/results
          docker compose logs --no-color > conformance/results/services.log 2>&1 || true
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path('conformance/results/results.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\nIssuer tested: ' + os.environ.get('IDENTITY_URL', '(tunnel not created)') + '\n\n')
              if report.exists():
                  result = json.loads(report.read_text())
                  summary.write('Official plan: ' + result['plan_url'] + '\n\n')
                  if result.get('response_type'):
                      summary.write('Response type: `' + result['response_type'] + '`\n\n')
                  for status, count in result['summary'].items():
                      summary.write(f'- {status}: {count}\n')
              else:
                  plan_url = Path('conformance/results/plan-url.txt')
                  if plan_url.exists():
                      summary.write('Official plan: ' + plan_url.read_text().strip() + '\n\n')
                  summary.write('No complete report; inspect the service and runner logs.\n')
          PY

      - name: Close tunnel and remove test database
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 20

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oidc-conformance-${{ matrix.id }}-${{ github.run_id }}
          path: conformance/results/
          retention-days: 14

  summary:
    name: Summarize all OP plans
    needs: [prepare, conformance]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all plan reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: oidc-conformance-*-${{ github.run_id }}
          path: reports

      - name: Summarize results including failed and incomplete plans
        env:
          PROFILES: ${{ needs.prepare.outputs.profiles }}
          PLAN_JOBS_RESULT: ${{ needs.conformance.result }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          reports = {}
          for path in Path('reports').rglob('results.json'):
              report = json.loads(path.read_text())
              reports[report.get('case_id', report['profile'])] = report
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('All plan jobs: **' + os.environ['PLAN_JOBS_RESULT'] + '**\n\n')
              output.write('| Plan | Response type | Status | Passed | Failed | UI review | Official results |\n|---|---|---|---:|---:|---:|---|\n')
              for profile in json.loads(os.environ['PROFILES']):
                  report = reports.get(profile)
                  if report is None:
                      plan_url = Path('reports') / f"oidc-conformance-{profile}-{os.environ['GITHUB_RUN_ID']}" / 'plan-url.txt'
                      link = f'[Plan]({plan_url.read_text().strip()})' if plan_url.exists() else '—'
                      output.write(f'| {profile} | — | NO_REPORT | — | — | — | {link} |\n')
                      continue
                  counts = report['summary']
                  results = report['results']
                  expected = len(report['plan']['modules'])
                  incomplete = (not results or len(results) != expected
                                or any(r['status'] != 'FINISHED' for r in results))
                  status = 'INCOMPLETE' if incomplete else ('FAILED' if counts['FAILED'] else 'COMPLETED')
                  response_type = report.get('response_type') or '—'
                  output.write(f"| {profile} | {response_type} | {status} | {counts['PASSED']} | {counts['FAILED']} | {counts.get('MANUAL_REVIEW_REQUIRED', 0)} | [Plan]({report['plan_url']}) |\n")
          PY
