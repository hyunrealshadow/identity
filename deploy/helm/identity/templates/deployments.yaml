apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "identity.fullname" . }}-server
  labels:
    {{- include "identity.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.identity.replicaCount }}
  selector:
    matchLabels:
      {{- include "identity.serverSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "identity.serverSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.identity.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "identity.serverServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.identity.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.identity.image.repository }}:{{ .Values.identity.image.tag }}"
          imagePullPolicy: {{ .Values.identity.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.identity.securityContext | nindent 12 }}
          env:
            - name: APP_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identity.database.existingSecret }}
                  key: {{ .Values.identity.database.urlKey }}
            {{- if .Values.identity.observability.pii.existingSecret }}
            - name: IDENTITY_PII_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identity.observability.pii.existingSecret }}
                  key: {{ .Values.identity.observability.pii.key }}
            {{- end }}
            {{- with .Values.identity.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: {{ ternary "https" "http" .Values.identity.tls.enabled }}
              containerPort: {{ .Values.identity.service.publicPort }}
              protocol: TCP
            - name: {{ ternary "internal-https" "internal-http" .Values.identity.tls.enabled }}
              containerPort: {{ .Values.identity.service.internalPort }}
              protocol: TCP
            - name: {{ ternary "graphql-https" "graphql-http" .Values.identity.tls.enabled }}
              containerPort: {{ .Values.identity.service.graphqlPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.identity.service.healthPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: health
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: health
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: health
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.identity.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config/production.yaml
              subPath: production.yaml
              readOnly: true
            {{- if .Values.identity.tls.enabled }}
            - name: tls
              mountPath: /etc/identity/tls
              readOnly: true
            {{- end }}
            {{- if .Values.identity.workload.issuerCa.enabled }}
            - name: kubernetes-issuer-ca
              mountPath: /etc/identity/kubernetes
              readOnly: true
            {{- end }}
            {{- if .Values.identity.workload.issuerToken.enabled }}
            - name: kubernetes-issuer-token
              mountPath: /var/run/secrets/identity-issuer
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "identity.fullname" . }}-config
        {{- if .Values.identity.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.identity.tls.existingSecret }}
            items:
              - key: {{ .Values.identity.tls.certKey }}
                path: tls.crt
              - key: {{ .Values.identity.tls.privateKeyKey }}
                path: tls.key
        {{- end }}
        {{- if .Values.identity.workload.issuerCa.enabled }}
        - name: kubernetes-issuer-ca
          configMap:
            name: {{ .Values.identity.workload.issuerCa.configMapName }}
            items:
              - key: {{ .Values.identity.workload.issuerCa.key }}
                path: ca.crt
        {{- end }}
        {{- if .Values.identity.workload.issuerToken.enabled }}
        - name: kubernetes-issuer-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.identity.workload.issuer | quote }}
                  expirationSeconds: {{ .Values.identity.workload.issuerToken.expirationSeconds }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.identity.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.identity.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.identity.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "identity.fullname" . }}-login
  labels:
    {{- include "identity.labels" . | nindent 4 }}
    app.kubernetes.io/component: login
spec:
  replicas: {{ .Values.login.replicaCount }}
  selector:
    matchLabels:
      {{- include "identity.loginSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "identity.loginSelectorLabels" . | nindent 8 }}
      {{- with .Values.login.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "identity.loginServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.login.podSecurityContext | nindent 8 }}
      containers:
        - name: login
          image: "{{ .Values.login.image.repository }}:{{ .Values.login.image.tag }}"
          imagePullPolicy: {{ .Values.login.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.login.securityContext | nindent 12 }}
          env:
            - name: IDENTITY_BACKCHANNEL_API_URL
              value: {{ printf "%s://%s-server:%v" (ternary "https" "http" .Values.identity.tls.enabled) (include "identity.fullname" .) .Values.identity.service.publicPort | quote }}
            - name: IDENTITY_BACKCHANNEL_GRAPHQL_URL
              value: {{ printf "%s://%s-server:%v" (ternary "https" "http" .Values.identity.tls.enabled) (include "identity.fullname" .) .Values.identity.service.graphqlPort | quote }}
            - name: IDENTITY_BACKCHANNEL_ALLOW_HTTP
              value: {{ ternary "false" "true" .Values.identity.tls.enabled | quote }}
            - name: IDENTITY_INTERNAL_API_URL
              value: {{ printf "%s://%s-server-internal:%v" (ternary "https" "http" .Values.identity.tls.enabled) (include "identity.fullname" .) .Values.identity.service.internalPort | quote }}
            - name: IDENTITY_INTERNAL_API_ALLOW_HTTP
              value: {{ ternary "false" "true" .Values.identity.tls.enabled | quote }}
            - name: IDENTITY_LOGIN_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.login.sessionSecret.existingSecret }}
                  key: {{ .Values.login.sessionSecret.key }}
            - name: IDENTITY_WORKLOAD_TOKEN_FILE
              value: /var/run/secrets/identity/token
            - name: OTEL_SERVICE_NAME
              value: identity-login
            {{- if .Values.login.observability.otlp.enabled }}
            - name: IDENTITY_LOGIN_OTLP_ENABLE
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ required "login.observability.otlp.endpoint is required when OTLP is enabled" .Values.login.observability.otlp.endpoint | quote }}
            {{- end }}
            {{- with .Values.login.observability.sampling.traceRatio }}
            - name: IDENTITY_LOGIN_TRACE_SAMPLE_RATIO
              value: {{ . | quote }}
            {{- end }}
            - name: IDENTITY_LOGIN_METRICS_ENABLE
              value: {{ .Values.login.observability.selfMetrics.enabled | quote }}
            - name: IDENTITY_REQUIRE_UPSTREAM_HTTPS
              value: {{ ternary "false" "true" .Values.login.tls.enabled | quote }}
            {{- if .Values.identity.tls.enabled }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/identity/ca/ca.crt
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            {{- end }}
            {{- if .Values.login.tls.enabled }}
            - name: NITRO_SSL_CERT_FILE
              value: /etc/identity/login-tls/tls.crt
            - name: NITRO_SSL_KEY_FILE
              value: /etc/identity/login-tls/tls.key
            {{- end }}
            {{- with .Values.login.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: {{ ternary "https" "http" .Values.login.tls.enabled }}
              containerPort: {{ .Values.login.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: {{ ternary "https" "http" .Values.login.tls.enabled }}
              scheme: {{ ternary "HTTPS" "HTTP" .Values.login.tls.enabled }}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ ternary "https" "http" .Values.login.tls.enabled }}
              scheme: {{ ternary "HTTPS" "HTTP" .Values.login.tls.enabled }}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ ternary "https" "http" .Values.login.tls.enabled }}
              scheme: {{ ternary "HTTPS" "HTTP" .Values.login.tls.enabled }}
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.login.resources | nindent 12 }}
          volumeMounts:
            - name: workload-token
              mountPath: /var/run/secrets/identity
              readOnly: true
            {{- if .Values.identity.tls.enabled }}
            - name: identity-ca
              mountPath: /etc/identity/ca
              readOnly: true
            {{- end }}
            {{- if .Values.login.tls.enabled }}
            - name: login-tls
              mountPath: /etc/identity/login-tls
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workload-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.identity.workload.audience | quote }}
                  expirationSeconds: {{ .Values.identity.workload.expirationSeconds }}
        {{- if .Values.identity.tls.enabled }}
        - name: identity-ca
          secret:
            secretName: {{ .Values.login.internalCa.existingSecret }}
            items:
              - key: {{ .Values.login.internalCa.key }}
                path: ca.crt
        {{- end }}
        {{- if .Values.login.tls.enabled }}
        - name: login-tls
          secret:
            secretName: {{ .Values.login.tls.existingSecret }}
            items:
              - key: {{ .Values.login.tls.certKey }}
                path: tls.crt
              - key: {{ .Values.login.tls.privateKeyKey }}
                path: tls.key
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.login.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.login.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.login.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if .Values.console.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "identity.fullname" . }}-console
  labels:
    {{- include "identity.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicaCount }}
  selector:
    matchLabels:
      {{- include "identity.consoleSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "identity.consoleSelectorLabels" . | nindent 8 }}
      {{- with .Values.console.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "identity.consoleServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.console.podSecurityContext | nindent 8 }}
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.console.securityContext | nindent 12 }}
          env:
            - name: PORT
              value: {{ .Values.console.service.port | quote }}
            - name: IDENTITY_CONSOLE_TLS_ENABLED
              value: {{ .Values.console.tls.enabled | quote }}
            - name: IDENTITY_INTERNAL_API_URL
              value: {{ printf "%s://%s-server-internal:%v" (ternary "https" "http" .Values.identity.tls.enabled) (include "identity.fullname" .) .Values.identity.service.internalPort | quote }}
            - name: IDENTITY_INTERNAL_API_ALLOW_HTTP
              value: {{ ternary "false" "true" .Values.identity.tls.enabled | quote }}
            - name: IDENTITY_WORKLOAD_TOKEN_FILE
              value: /var/run/secrets/identity/token
            {{- if .Values.identity.tls.enabled }}
            - name: IDENTITY_CA_FILE
              value: /etc/identity/ca/ca.crt
            {{- end }}
            {{- with .Values.console.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: {{ ternary "https" "http" .Values.console.tls.enabled }}
              containerPort: {{ .Values.console.service.port }}
              protocol: TCP
          # The entrypoint stays alive while waiting for first installation.
          # Readiness checks the application listener using its selected transport.
          startupProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            failureThreshold: 6
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ ternary "https" "http" .Values.console.tls.enabled }}
              scheme: {{ ternary "HTTPS" "HTTP" .Values.console.tls.enabled }}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "if [ -f /run/identity-console/config.json ]; then curl --fail --silent --max-time 2 http://127.0.0.1:8081/health; else kill -0 1; fi"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.console.tls.enabled }}
            - name: console-tls
              mountPath: /etc/identity/console-tls
              readOnly: true
            {{- end }}
            - name: workload-token
              mountPath: /var/run/secrets/identity
              readOnly: true
            {{- if .Values.identity.tls.enabled }}
            - name: identity-ca
              mountPath: /etc/identity/ca
              readOnly: true
            {{- end }}
            - name: runtime
              mountPath: /run/identity-console
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.console.tls.enabled }}
        - name: console-tls
          secret:
            secretName: {{ .Values.console.tls.existingSecret }}
            items:
              - key: {{ .Values.console.tls.certKey }}
                path: tls.crt
              - key: {{ .Values.console.tls.privateKeyKey }}
                path: tls.key
        {{- end }}
        - name: workload-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.identity.workload.audience | quote }}
                  expirationSeconds: {{ .Values.identity.workload.expirationSeconds }}
        {{- if .Values.identity.tls.enabled }}
        - name: identity-ca
          secret:
            secretName: {{ .Values.console.internalCa.existingSecret }}
            items:
              - key: {{ .Values.console.internalCa.key }}
                path: ca.crt
        {{- end }}
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
