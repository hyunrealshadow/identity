{{- if and (not .Values.identity.tls.enabled) (empty .Values.identity.tls.trustedProxies) }}
{{- if empty .Values.identity.tls.directHttpClients }}
{{- fail "identity.tls must configure trustedProxies or directHttpClients when identity.tls.enabled=false" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "identity.fullname" . }}-config
  labels:
    {{- include "identity.labels" . | nindent 4 }}
data:
  production.yaml: |
    logger:
      enable: true
      level: info
      format: json
    server:
      binding: 0.0.0.0
      port: {{ .Values.identity.service.publicPort }}
      host: {{ .Values.identity.publicUrl | quote }}
      tls:
        {{- if .Values.identity.tls.enabled }}
        termination: direct
        auto_generate: false
        cert_path: /etc/identity/tls/tls.crt
        key_path: /etc/identity/tls/tls.key
        domain: {{ include "identity.fullname" . }}-server
        {{- else }}
        termination: upstream
        trusted_proxies:
          {{- toYaml .Values.identity.tls.trustedProxies | nindent 10 }}
        direct_http_clients:
          {{- toYaml .Values.identity.tls.directHttpClients | nindent 10 }}
        {{- end }}
    internal:
      server:
        binding: 0.0.0.0
        port: {{ .Values.identity.service.internalPort }}
      workloads:
        login:
          kubernetes_service_account:
            enabled: true
            audience: {{ .Values.identity.workload.audience | quote }}
            namespace: {{ .Release.Namespace | quote }}
            service_account: {{ include "identity.loginServiceAccountName" . | quote }}
            issuer: {{ .Values.identity.workload.issuer | quote }}
            {{- if .Values.identity.workload.issuerCa.enabled }}
            ca_file: /etc/identity/kubernetes/ca.crt
            {{- end }}
            {{- if .Values.identity.workload.issuerToken.enabled }}
            token_file: /var/run/secrets/identity-issuer/token
            {{- end }}
    client_credential_rotation:
      enable: {{ .Values.identity.rotation.enabled }}
      check_interval_secs: {{ .Values.identity.rotation.checkIntervalSeconds }}
      credential_lifetime_days: {{ .Values.identity.rotation.credentialLifetimeDays }}
      rotate_before_expiry_days: {{ .Values.identity.rotation.rotateBeforeExpiryDays }}
      retire_after_secs: {{ .Values.identity.rotation.retireAfterSeconds }}
    database:
      uri: {{ "{{ get_env(name=\"DATABASE_URL\") }}" }}
      enable_logging: false
      connect_timeout: 500
      idle_timeout: 500
      min_connections: 1
      max_connections: 20
      auto_migrate: true
    health:
      enable: true
      route: /health
      server:
        binding: 0.0.0.0
        port: {{ .Values.identity.service.healthPort }}
      checks:
        database: true
    graphql:
      server:
        binding: 0.0.0.0
        port: {{ .Values.identity.service.graphqlPort }}
      allowed_origins:
        - {{ .Values.login.publicUrl | quote }}
    settings:
      refresh_interval_secs: 30
