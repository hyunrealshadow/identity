{{- if and .Values.gatewayApi.enabled .Values.gatewayApi.identity.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "identity.fullname" . }}-identity
  labels:
    {{- include "identity.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
  {{- with .Values.gatewayApi.identity.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ required "gatewayApi.parentRef.name is required when Gateway API is enabled" .Values.gatewayApi.parentRef.name }}
      {{- with .Values.gatewayApi.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gatewayApi.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    {{- toYaml .Values.gatewayApi.identity.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "identity.fullname" . }}-identity
          port: {{ .Values.identity.service.publicPort }}
{{- end }}
{{- if and .Values.gatewayApi.enabled .Values.gatewayApi.login.enabled }}
{{- if and .Values.gatewayApi.enabled .Values.gatewayApi.identity.enabled }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "identity.fullname" . }}-login
  labels:
    {{- include "identity.labels" . | nindent 4 }}
    app.kubernetes.io/component: login
  {{- with .Values.gatewayApi.login.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ required "gatewayApi.parentRef.name is required when Gateway API is enabled" .Values.gatewayApi.parentRef.name }}
      {{- with .Values.gatewayApi.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gatewayApi.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    {{- toYaml .Values.gatewayApi.login.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "identity.fullname" . }}-login
          port: {{ .Values.login.service.port }}
{{- end }}
