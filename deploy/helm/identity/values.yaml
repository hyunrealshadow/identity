nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

identity:
  replicaCount: 2
  image:
    repository: identity
    tag: latest
    pullPolicy: IfNotPresent
  publicUrl: https://identity.example.com
  service:
    type: ClusterIP
    publicPort: 5150
    internalPort: 5151
    graphqlPort: 5152
    healthPort: 8081
  tls:
    enabled: true
    existingSecret: identity-tls
    certKey: tls.crt
    privateKeyKey: tls.key
    trustedProxies: []
    directHttpClients: []
  database:
    existingSecret: identity-database
    urlKey: url
  workload:
    audience: identity-internal
    expirationSeconds: 3600
    issuer: https://kubernetes.default.svc.cluster.local
    issuerCa:
      enabled: true
      configMapName: kube-root-ca.crt
      key: ca.crt
    issuerToken:
      enabled: true
      expirationSeconds: 3600
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  rotation:
    enabled: true
    checkIntervalSeconds: 60
    credentialLifetimeDays: 180
    rotateBeforeExpiryDays: 30
    retireAfterSeconds: 86400
  observability:
    # Console output is optional in production; OTLP is the primary channel.
    console: false
    otlp:
      enabled: true
      endpoint: http://otel-collector.observability.svc.cluster.local:4318
      timeoutMs: 10000
      compression: none
    sampling:
      # null uses the production default of 10%.
      traceRatio: null
    traceContext:
      # Default: trust no network; only workload-authenticated requests may
      # continue an inbound trace.
      trustedGateways: []
      trustVerifiedWorkload: true
      # Origins allowed to receive W3C context on outbound calls. Empty means
      # no outbound target inherits internal context.
      propagateToOrigins: []
    pii:
      # Name an existing Secret containing the HMAC pseudonymization key. When
      # empty, PII fields render as [REDACTED].
      existingSecret: ""
      key: hmac-key
      keyVersion: v1
    events:
      queueCapacity: 8192
      queueBytes: 16777216
    selfMetrics:
      enabled: true
      route: /internal/observability/metrics
  resources: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

login:
  replicaCount: 2
  image:
    repository: identity-login
    tag: latest
    pullPolicy: IfNotPresent
  publicUrl: https://account.example.com
  service:
    type: ClusterIP
    port: 3000
  tls:
    enabled: false
    existingSecret: identity-login-tls
    certKey: tls.crt
    privateKeyKey: tls.key
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  sessionSecret:
    existingSecret: identity-login-session
    key: session-secret
  internalCa:
    existingSecret: identity-internal-ca
    key: ca.crt
  observability:
    otlp:
      # Login exports server/client spans and key events to the collector.
      enabled: false
      endpoint: http://otel-collector.observability.svc.cluster.local:4318
    sampling:
      # null keeps the pipeline default of 100% for login server spans.
      traceRatio: null
    selfMetrics:
      enabled: false
  resources: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: false
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

gatewayApi:
  enabled: false
  parentRef:
    name: identity
    namespace: ""
    sectionName: https
  identity:
    enabled: true
    annotations: {}
    hostnames:
      - identity.example.com
  login:
    enabled: true
    annotations: {}
    hostnames:
      - account.example.com

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
