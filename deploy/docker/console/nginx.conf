load_module modules/ngx_http_js_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
# The Console workload credential is read per request by console-config.js.
env IDENTITY_WORKLOAD_TOKEN;
env IDENTITY_WORKLOAD_TOKEN_FILE;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format console_access escape=json
        '{"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent}';
    access_log /dev/stdout console_access;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    js_import console from /etc/nginx/console-config.js;
    js_set $console_workload_authorization console.authorization;
    subrequest_output_buffer_size 16k;

    map $uri $console_cache_control {
        default "no-cache";
        /console/config.json "no-store";
        ~^/console/assets/ "public, max-age=31536000, immutable";
    }
    map $status $response_cache_control {
        default $console_cache_control;
        ~^[45] "no-store";
    }

    server {
        listen @CONSOLE_LISTEN@;
        @CONSOLE_TLS@
        absolute_redirect off;
        root /usr/share/nginx/html;
        add_header Cache-Control $response_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        location = /health/ready { access_log off; return 200 "ok\n"; }
        location = /console {
            try_files /console/index.html =404;
        }
        location = /console/ { return 308 /console$is_args$args; }
        # Fetched from Identity on every request; never cached or snapshotted.
        location = /console/config.json {
            js_content console.config;
        }
        location = /_identity/runtime-configuration {
            internal;
            proxy_pass @IDENTITY_RUNTIME_URL@;
            # Browser headers, cookies and bodies never reach Identity.
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Authorization $console_workload_authorization;
            proxy_set_header Accept application/json;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_intercept_errors off;
            @IDENTITY_TLS@
        }
        location /console/assets/ {
            try_files $uri =404;
        }
        location /console/ {
            try_files $uri $uri/ /console/index.html;
        }
        location / { return 404; }
    }

    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /health { return 200 "ok\n"; }
        location / { return 404; }
    }
}
