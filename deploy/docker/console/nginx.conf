worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format console_access escape=json
        '{"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent}';
    access_log /dev/stdout console_access;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $uri $console_cache_control {
        default "no-cache";
        /config.json "no-store";
        ~^/assets/ "public, max-age=31536000, immutable";
    }
    map $status $response_cache_control {
        default $console_cache_control;
        ~^[45] "no-store";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header Cache-Control $response_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        location = /config.json {
            alias /run/identity-console/config.json;
            default_type application/json;
        }
        location /assets/ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /health { return 200 "ok\n"; }
        location / { return 404; }
    }
}
