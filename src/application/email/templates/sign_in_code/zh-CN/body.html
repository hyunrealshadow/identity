<!doctype html>
<html lang="{{ locale }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>你的登录验证码</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;color:#18181b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 16px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;">
<tr><td style="padding:32px 32px 8px;">
<p style="margin:0 0 16px;font-size:15px;line-height:24px;">{{ user.name }}，你好：</p>
<p style="margin:0 0 24px;font-size:15px;line-height:24px;">请使用以下验证码{% if application %}登录 <strong>{{ application.name }}</strong>{% else %}登录{% endif %}：</p>
<p style="margin:0 0 24px;padding:16px;background:#f4f4f5;border-radius:8px;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:30px;font-weight:600;letter-spacing:8px;">{{ code }}</p>
<p style="margin:0 0 24px;text-align:center;"><a href="{{ link }}" style="display:inline-block;padding:10px 20px;background:#18181b;color:#ffffff;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;">登录</a></p>
<p style="margin:0 0 8px;font-size:13px;line-height:20px;color:#52525b;">验证码和链接将在 {{ expires_in_minutes }} 分钟后失效，且只能使用一次。</p>
<p style="margin:0 0 24px;font-size:13px;line-height:20px;color:#52525b;">如果这不是你本人的操作，请忽略此邮件。不要将验证码告诉任何人。</p>
</td></tr>
<tr><td style="padding:16px 32px 24px;border-top:1px solid #e4e4e7;font-size:12px;line-height:18px;color:#71717a;word-break:break-all;">如果按钮无法使用，请打开此链接：<br><a href="{{ link }}" style="color:#52525b;">{{ link }}</a></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
