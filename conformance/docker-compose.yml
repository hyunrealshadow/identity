services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity_conformance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity_conformance"]
      interval: 5s
      timeout: 5s
      retries: 10
  identity:
    build:
      context: ..
      dockerfile: conformance/Dockerfile
    environment:
      APP_ENV: conformance
      DATABASE_URL: postgres://identity:identity@db:5432/identity_conformance
      HOST: https://identity:5150
      LOGIN_URL: https://localhost:3443/login
      CONSENT_URL: https://localhost:3443/consent
      TLS_DOMAIN: identity
      PORT: "5150"
      IDENTITY_WORKLOAD_TOKEN: dev-login-workload-token-0123456789abcdef
    ports:
      - "5150:5150"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
  login:
    build:
      context: ..
      dockerfile: conformance/login.Dockerfile
    environment:
      IDENTITY_API_URL: https://identity:5150
      IDENTITY_INTERNAL_API_URL: https://identity:5151
      IDENTITY_WORKLOAD_TOKEN: dev-login-workload-token-0123456789abcdef
      IDENTITY_LOGIN_SESSION_SECRET: conformance-login-session-secret-0123456789
      IDENTITY_PUBLIC_APP_URL: https://localhost:3443
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongodb:
    image: mongo:6.0.13
  server:
    build:
      context: ./server
    command: >
      java
      -jar /app/fapi-test-suite.jar
      -Djdk.tls.maxHandshakeMessageSize=65536
      --fintechlabs.base_url=https://localhost.emobix.co.uk:8443
      --fintechlabs.devmode=true
      --fintechlabs.startredir=true
    links:
      - mongodb:mongodb
    depends_on:
      - mongodb
    logging:
      # limit logs retained on host
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"
  nginx:
    build:
      context: ./nginx
    ports:
      - "8443:8443"
      - "3443:3443"
    networks:
      default:
        aliases:
          - localhost.emobix.co.uk
    depends_on:
      server:
        condition: service_started
      login:
        condition: service_healthy
