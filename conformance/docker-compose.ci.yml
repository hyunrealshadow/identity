# Quick Tunnel starts first so CI can configure identity with its generated issuer.
services:
  identity:
    environment:
      HOST: ${IDENTITY_URL:-https://identity:5150}
  server:
    build:
      args:
        SUITE_REF: ${SUITE_REF:-master}
    # The Dockerfile already supplies java -jar through ENTRYPOINT.
    command:
      - --fintechlabs.base_url=https://localhost.emobix.co.uk:8443
      - --fintechlabs.devmode=true
      - --fintechlabs.startredir=true
  tunnel:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - https://identity:5150
      - --no-tls-verify
