[workspace]
members = [
  ".",
  "migration",
  "src/application",
  "src/boot",
  "src/domain",
  "src/infrastructure",
  "src/web",
]
resolver = "3"

[workspace.dependencies]
apalis = { version = "0.7.4" }
apalis-cron = { version = "0.7.4" }
apalis-sql = { version = "0.7.4", features = ["postgres", "tokio-comp"] }
anyhow = { version = "1.0.104" }
async-trait = { version = "0.1.92" }
async-graphql = { version = "7.2.1", default-features = false, features = ["chrono", "graphiql", "url"] }
base64 = { version = "0.23.1" }
chacha20poly1305 = { version = "0.11.0" }
chrono = { version = "0.4.45", features = ["serde"] }
http = "1.5.0"
idna = { version = "1.1.0" }
ipnet = { version = "2.12.2", features = ["serde"] }
josekit = { version = "0.10.3" }
migration = { path = "migration" }
openssl = { version = "0.10.81" }
rand = { version = "0.10.3" }
regex = { version = "1.13.1" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
salvo = { version = "1.0.1", features = ["affix-state", "csrf", "serve-static", "test", "rustls"] }
sea-orm = { version = "2.0.4", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "mock",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
serial_test = { version = "4.0.1" }
strum = { version = "0.28.0", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["from", "into"] }
hmac = { version = "0.13.0" }
opentelemetry = "0.33.0"
opentelemetry-appender-tracing = { version = "0.33.0", default-features = false }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "logs",
  "metrics",
  "trace",
] }
opentelemetry_sdk = "0.33.0"
sha2 = { version = "0.11.0" }
subtle = { version = "2.6.1" }
tera = { version = "2.4.0", features = ["glob_fs"] }
thiserror = { version = "2.0.21" }
tracing-opentelemetry = "0.34.0"
tokio = { version = "1.53.2", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "net",
  "sync",
  "time",
] }
tracing = { version = "0.1.44" }
unic-langid = { version = "0.9.6" }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
ulid = { version = "3.0.0" }
woothee = { version = "0.13.0" }

[workspace.dependencies.identity-application]
path = "src/application"

[workspace.dependencies.identity-boot]
path = "src/boot"

[workspace.dependencies.identity-domain]
path = "src/domain"

[workspace.dependencies.identity-infrastructure]
path = "src/infrastructure"

[workspace.dependencies.identity-web]
path = "src/web"

[package]
name = "identity"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "identity"

[dependencies]
chrono = { workspace = true }
identity-application = { workspace = true }
identity-boot = { workspace = true }
identity-domain = { workspace = true }
identity-infrastructure = { workspace = true }
identity-web = { workspace = true }
salvo = { workspace = true }
sea-orm = { workspace = true }
serde_json = { workspace = true }
tera = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
oidc-conformance = [
  "identity-application/oidc-conformance",
  "identity-boot/oidc-conformance",
  "identity-infrastructure/oidc-conformance",
  "identity-web/oidc-conformance",
]
allow-none-alg = ["identity-application/allow-none-alg"]

[[bin]]
name = "identity"
path = "src/main.rs"
required-features = []

[dev-dependencies]
serial_test = { workspace = true }

[profile.release]
# Retain line tables so production stack traces can resolve source locations.
debug = "line-tables-only"
