<!doctype html>
<html lang="{{ lang | default(value='en') }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title></head>
<body>
  <main><h1>{{ title }}</h1></main>
  {% for notification in frontchannel_notifications %}
  <iframe src="{{ notification.logout_uri }}" title="front-channel logout" hidden></iframe>
  {% endfor %}
  {% if post_logout_redirect_uri %}
  <p><a href="{{ post_logout_redirect_uri }}">Continue</a></p>
  <script nonce="{{ nonce }}">setTimeout(function(){window.location.href="{{ post_logout_redirect_uri | safe }}";}, 300);</script>
  {% endif %}
</body>
</html>
