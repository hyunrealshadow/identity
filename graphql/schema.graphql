	defaultMaxAge: Int
	requireAuthTime: Boolean!
	"""
	Authentication context classes requested when a request names none,
	in order of preference; any one of them satisfies the request. Empty
	lets the request decide.
	"""
	defaultAcrValues: [String!]!
	idTokenSignedResponseAlgs: [String!]!
	idTokenEncryptedResponseAlgs: [String!]!
	idTokenEncryptedResponseEncs: [String!]!
	userinfoSignedResponseAlgs: [String!]!
	userinfoEncryptedResponseAlgs: [String!]!
