type AuthenticationSettings {
	"""
	Reject passwords that appear in known breaches.
	"""
	breachedPasswordCheckEnabled: Boolean!
	"""
	Whether sign-in may reveal that an entered email or username has no
	account. When false, every identifier continues to the password step
	and a failure does not say whether the account or the password was
	wrong.
	"""
	identifierEnumerationAllowed: Boolean!
	"""
	Whether an account with a verified email address may sign in with a
	code or link sent to it. Offered only while email delivery is
	configured.
	"""
	emailSignInEnabled: Boolean!
	"""
	Whether someone who forgot their password may replace it from the
	sign-in flow with a link sent to the account's verified email address.
	Offered only while email delivery is configured.
	"""
	passwordResetEnabled: Boolean!
	"""
	Whether someone without an account may create one from the sign-in
	flow after verifying their email address. Offered only while email
	delivery is configured.
	"""
	registrationEnabled: Boolean!
	"""
	Days a password stays usable before the next sign-in must replace it.
	`0` means passwords do not expire.
	"""
	passwordMaxAgeDays: Int!
	passwordMaxAgeDaysRange: IntRange!
	"""
	How many recent passwords, the current one included, a new password
	may not repeat. `0` turns the check off.
	"""
	passwordHistoryCount: Int!
	passwordHistoryCountRange: IntRange!
	"""
	Argon2id cost for newly stored password hashes.
	"""
	passwordHashing: PasswordHashing!
	"""
	UUID optimistic-lock version of this section.
	"""
	version: UUID!
}

