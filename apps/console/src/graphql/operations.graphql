query ConsoleBootstrap {
  effectivePermissions {
    role
    requestableScopes
    grantedScopes
    effectiveScopes
    authentication {
      acr
      authTime
      aal2
      recent
    }
  }
  instanceInfo {
    name
    environment
    issuer
    version
  }
}

# The operator's theme preference from the account center. Needs `account.read`;
# without it the Console keeps the local theme.
query ConsoleAccountTheme {
  account {
    id
    theme
  }
}
