fragment AuditEventFields on AuditEvent {
  id
  occurredAt
  category
  action
  outcome
  failureReason
  actor {
    kind
    id
    oid
    label
    user @include(if: $includeActorUser) {
      id
      username
      email
      nickname
    }
    client @include(if: $includeActorClient) {
      id
      name
      names {
        locale
        value
      }
    }
  }
  target {
    kind
    id
    oid
    label
  }
  clientId
  authMethods
  ipAddress
  userAgent
  requestId
  traceId
  changes {
    field
    kind
    oldValue
    newValue
    added
    removed
  }
}

query AuditEventsQuery(
  $query: String
  $timeZone: String
  $orderBy: AuditEventOrder
  $first: Int
  $after: String
  $last: Int
  $before: String
  $includeActorUser: Boolean!
  $includeActorClient: Boolean!
) {
  auditEvents(
    query: $query
    timeZone: $timeZone
    orderBy: $orderBy
    first: $first
    after: $after
    last: $last
    before: $before
  ) {
    totalCount
    pageInfo {
      hasPreviousPage
      hasNextPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        ...AuditEventFields
      }
    }
  }
}

query AuditEventDetailQuery(
  $id: ID!
  $includeActorUser: Boolean!
  $includeActorClient: Boolean!
) {
  auditEvent(id: $id) {
    ...AuditEventFields
    client @include(if: $includeActorClient) {
      id
      name
      names {
        locale
        value
      }
    }
    device {
      browser
      browserVersion
      os
      osVersion
    }
  }
}
