query ConsoleUserRoles(
  $userId: ID!
  $enabled: Boolean
  $orderBy: UserRoleOrder
  $first: Int
  $after: String
  $last: Int
  $before: String
) {
  user(id: $userId) {
    id
    roles(
      enabled: $enabled
      orderBy: $orderBy
      first: $first
      after: $after
      last: $last
      before: $before
    ) {
      userVersion
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      edges {
        cursor
        enabled
        revokedAt
        reason
        createdAt
        updatedAt
        node {
          id
          name
          description
          enabled
          names {
            locale
            value
          }
        }
      }
    }
  }
}

query ConsoleUserRoleVersion($userId: ID!) {
  user(id: $userId) {
    id
    roles(first: 1) {
      userVersion
    }
  }
}

query ConsoleUserPermissions(
  $userId: ID!
  $resourceId: ID!
  $orderBy: EffectivePermissionOrder
  $first: Int
  $after: String
  $last: Int
  $before: String
) {
  user(id: $userId) {
    id
    effectivePermissions(
      resourceId: $resourceId
      orderBy: $orderBy
      first: $first
      after: $after
      last: $last
      before: $before
    ) {
      totalCount
      userVersion
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      edges {
        cursor
        node {
          permissionId
          resourceId
          code
          sources {
            roleId
          }
          groupSources {
            groupId
            roleId
          }
        }
      }
    }
  }
}

mutation ConsoleAssignUserRoles($input: AssignUserRolesInput!) {
  assignUserRoles(input: $input) {
    userId
    userVersion
    createdCount
    revokedCount
  }
}

mutation ConsoleRevokeUserRoles($input: RevokeUserRolesInput!) {
  revokeUserRoles(input: $input) {
    userId
    userVersion
    createdCount
    revokedCount
  }
}

query ConsoleAuthorizationLabels($ids: [ID!]!) {
  nodes(ids: $ids) {
    id
    __typename
    ... on Scope {
      code
      name
      description
      names {
        locale
        value
      }
      descriptions {
        locale
        value
      }
    }
    ... on Group {
      name
      names {
        locale
        value
      }
    }
    ... on Role {
      name
      description
      names {
        locale
        value
      }
    }
  }
}
