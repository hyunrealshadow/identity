query ConsoleRoles(
  $filter: RoleFilter
  $orderBy: RoleOrder
  $first: Int
  $after: String
  $last: Int
  $before: String
) {
  roles(
    filter: $filter
    orderBy: $orderBy
    first: $first
    after: $after
    last: $last
    before: $before
  ) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        id
        name
        description
        builtIn
        names {
          locale
          value
        }
        descriptions {
          locale
          value
        }
        enabled
        version
        createdAt
        updatedAt
      }
    }
  }
}

query ConsoleRole($id: ID!) {
  role(id: $id) {
    id
    name
    description
    builtIn
    names {
      locale
      value
    }
    descriptions {
      locale
      value
    }
    enabled
    version
    createdAt
    updatedAt
  }
}

mutation ConsoleCreateRole($input: CreateRoleInput!) {
  createRole(input: $input) {
    roleId
    version
  }
}

mutation ConsoleUpdateRole($input: UpdateRoleInput!) {
  updateRole(input: $input) {
    roleId
    version
  }
}

mutation ConsoleEnableRole($input: RoleStateInput!) {
  enableRole(input: $input) {
    roleId
    version
  }
}

mutation ConsoleDisableRole($input: RoleStateInput!) {
  disableRole(input: $input) {
    roleId
    version
  }
}

mutation ConsoleSetRolePermissions($input: SetRolePermissionsInput!) {
  setRolePermissions(input: $input) {
    roleId
    version
  }
}

query ConsoleRoleUsers(
  $roleId: ID!
  $enabled: Boolean
  $orderBy: UserRoleOrder
  $first: Int
  $after: String
  $last: Int
  $before: String
) {
  role(id: $roleId) {
    id
    users(
      enabled: $enabled
      orderBy: $orderBy
      first: $first
      after: $after
      last: $last
      before: $before
    ) {
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      edges {
        cursor
        enabled
        revokedAt
        reason
        createdAt
        updatedAt
        node {
          id
          username
          email
          enabled
          locked
          version
        }
      }
    }
  }
}

query ConsoleResourceOptions(
  $filter: ResourceFilter
  $first: Int
  $after: String
) {
  resources(filter: $filter, orderBy: NAME_ASC, first: $first, after: $after) {
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        id
        uri
        name
        enabled
      }
    }
  }
}
